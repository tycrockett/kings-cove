[package]
name = "kings-cove-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
nsh-core = "0.6.1"
nsh-base = "0.6.1"
env_logger = "0.11"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
kings-cove-engine.workspace = true
kings-cove-protocol.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.1", default-features = false, features = ["svg", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false, features = ["svg", "net"] }

[dev-dependencies]
nsh-engine = "0.6.1"
nsh-testing = "0.6.1"
