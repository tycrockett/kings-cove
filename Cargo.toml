[workspace]
resolver = "3"
members = ["engine", "protocol", "server", "app"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kings-cove-engine = { path = "engine" }
kings-cove-protocol = { path = "protocol" }
